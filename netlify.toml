[build]
  publish = "."

# ── SECURITY & PERFORMANCE HEADERS ───────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "SAMEORIGIN"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"
    # CSP: includes all GA4 regional endpoints and HubSpot
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://api.hsforms.com https://js.hsforms.net https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://region1.analytics.google.com https://api.hsforms.com; frame-src 'none';"

# ── ASSET CACHING ─────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── REDIRECTS ─────────────────────────────────────────────────
# NOTE: No redirect rules needed for this static site.
# - Netlify natively handles trailing slashes for directories (/blog → /blog/)
# - Netlify natively serves 404.html for any unmatched path (no catch-all needed)
# Adding manual rules for either of these conflicts with Netlify's built-in
# behavior and causes ERR_TOO_MANY_REDIRECTS loops.
